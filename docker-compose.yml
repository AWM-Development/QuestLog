services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog
    ports:
      # QUESTLOG_PG_PORT lets a per-worktree stack (T-072) run on its own
      # port; unset (primary working directory) keeps the prior fixed 5433.
      - "${QUESTLOG_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
