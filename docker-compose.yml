# Explicit `name:` pins the Compose project regardless of which directory
# `docker compose up` runs from — every worktree's session-start.sh and a
# human's interactive `docker compose up -d` (README's setup step 3) all
# converge on this one instance instead of each worktree spinning up its own
# container on a checksum-derived port. One shared, long-lived Postgres;
# isolation moves to the database-name layer instead (T-154, superseding the
# per-worktree-container design — see Docs/IMPLEMENTATION_NOTES.md § T-154).
name: questlog
services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
