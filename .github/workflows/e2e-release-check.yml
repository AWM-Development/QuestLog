name: E2E Release Check (real external APIs)

# Real-API integration proof (*.e2e.test.ts): real DB + the real Voyage
# embeddings API. Deliberately decoupled from the pr-gate workflow (ci.yml)
# — see Docs/IMPLEMENTATION_NOTES.md for why (Voyage's free-tier 3 RPM cap
# makes it unreliable as a per-PR merge gate, and it answers "does the
# vendor/account integration still work," not "is this PR's code correct,"
# which the mocked suite in ci.yml already gates on).
#
# Triggered by a push to `main` — i.e. exactly when `develop` gets promoted
# to `main` as a deliberate release (per this repo's branch model: main is
# deploy-only, releases are rare and manual). That's the meaningful moment
# to confirm the real integration still works, not an arbitrary nightly
# cadence disconnected from whether anything actually shipped.
#
# workflow_dispatch is also available for an on-demand check against
# `develop` (or any ref) whenever you want confidence before deciding to
# release, without waiting for an actual merge to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to test"
        required: false
        default: "develop"

jobs:
  e2e:
    name: Real-API E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          # Bootstrap DB only, not load-bearing after boot. Why:
          # Docs/IMPLEMENTATION_NOTES.md § T-071.
          POSTGRES_DB: questlog_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Turborepo local cache ────────────────────────────────────────────
      # Mirrors ci.yml — kept structurally parallel even though this
      # workflow only runs test:e2e (uncacheable): lint/typecheck/build
      # aren't invoked here, so this step is a no-op today, not a source of
      # divergence if a future change adds one of those tasks to this
      # workflow. Why: Docs/tickets/T-086.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'biome.json', 'tsconfig.base.json', 'apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/tsconfig*.json', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/tsconfig*.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # ── Provision and migrate every test-tier database ──────────────────
      # Mirrors ci.yml. Why: Docs/tickets/T-086, Docs/IMPLEMENTATION_NOTES.md
      # § T-071 (also § T-027).
      - name: Provision and migrate test-tier databases
        run: |
          source scripts/test-db-names.sh
          for template in "${TEST_DB_TEMPLATES[@]}"; do
            PGPASSWORD=questlog psql -h localhost -p 5433 -U questlog -d questlog_test -c "CREATE DATABASE ${template}"
          done
          DATABASE_URL="postgresql://questlog:questlog@localhost:5433/${TEST_DB_TEMPLATE_CORE}" eval "$(test_db_migrate_cmd "$TEST_DB_NAME_CORE")"
          DATABASE_URL="postgresql://questlog:questlog@localhost:5433/${TEST_DB_TEMPLATE_OBSERVABILITY}" eval "$(test_db_migrate_cmd "$TEST_DB_NAME_OBSERVABILITY")"
          for dbname in "${TEST_DB_NAMES_CI[@]}"; do
            template="$(test_db_template_name "$dbname")"
            PGPASSWORD=questlog psql -h localhost -p 5433 -U questlog -d questlog_test -c "CREATE DATABASE ${dbname} TEMPLATE ${template}"
          done

      - name: Real-API e2e tests
        run: pnpm turbo test:e2e
