name: Deploy

# Triggered on push to `main` only — i.e. exactly when Alex deliberately
# merges `develop` into `main` (this repo's branch model: main is
# deploy-only, releases are rare and manual, see
# Docs/IMPLEMENTATION_NOTES.md "main is deploy-only"). Not every merge to
# `develop` — that would deploy prod on every ticket PR, which this repo's
# branch model explicitly does not want (Docs/tickets/EXECUTOR_ROUTINE.md's
# CRITICAL BRANCH RULES: `main` is touched only by Alex, never by the
# executor). Same trigger shape as .github/workflows/e2e-release-check.yml,
# and deliberately narrower than it — no workflow_dispatch here, since a
# manual out-of-band prod deploy should be a conscious `flyctl deploy`
# Alex runs himself (Docs/DEPLOY_SETUP_CHECKLIST.md), not a CI button.
#
# Requires the FLY_API_TOKEN repository secret (Docs/DEPLOY_SETUP_CHECKLIST.md)
# — this workflow is generated but inert until that secret and the Fly app
# itself (questlog-prod, fly.prod.toml) actually exist.

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy apps/server to Fly.io (prod)
    runs-on: ubuntu-latest
    concurrency: deploy-prod

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.prod.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
