name: Smoke Test (prod)

# Read-only post-merge check against real prod — no write path, ever.
# Rationale: Docs/IMPLEMENTATION_NOTES.md § T-037.
#
# The actual checkout/poll/run steps live in the shared smoke-test.yml
# (T-123) — this file only carries the trigger and this environment's
# inputs/secrets, so `on:` stays visible here without opening that file.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test-prod:
    uses: ./.github/workflows/smoke-test.yml
    with:
      base-url-env-name: PROD_BASE_URL
      base-url: https://questlog-prod.fly.dev
      smoke-script: smoke:prod
    secrets:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
