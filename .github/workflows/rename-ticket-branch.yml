name: Rename Ticket Branch

# Claude Code on the web assigns each session its own auto-generated branch
# name (e.g. `claude/admiring-heisenberg-mhbypt`), independent of whatever
# branch name a ticket specifies in its `Branch:` field. The executor can't
# override that from inside the session (Docs/tickets/EXECUTOR_ROUTINE.md
# Step 2's documented fallback). This workflow fixes it up from the outside,
# after the PR exists, using the repo's own permissions rather than the
# session's: it finds the ticket a freshly-opened PR just shipped
# (Docs/tickets/done/T-###-*.md added in the diff), reads that ticket's
# intended `Branch:` name, and renames the PR's branch to match. GitHub's
# branch-rename API retargets the open PR automatically — no need to close
# and reopen it.
#
# Caveat: if a later session pushes follow-up commits (e.g. responding to
# review comments) to the *original* session-assigned branch name, those
# commits land on a new, disconnected branch — not on the renamed PR. Any
# session babysitting a PR after this workflow may have run should look up
# the PR's current head ref via the GitHub API before pushing, rather than
# assuming it still matches the branch it started on.

on:
  pull_request:
    types: [opened]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  rename-ticket-branch:
    name: Rename ticket branch to convention
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'claude/')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the ticket this PR shipped and its target branch name
        id: ticket
        env:
          CURRENT_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          ADDED=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")
          TICKET_FILE=$(echo "$ADDED" | grep -E '^Docs/tickets/done/T-[0-9]+-.*\.md$' | head -n1 || true)

          if [ -z "$TICKET_FILE" ]; then
            echo "No Docs/tickets/done/T-###-*.md added by this PR — not a ticket-pipeline PR, skipping."
            echo "should_rename=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_BRANCH=$(grep -m1 '^Branch:' "$TICKET_FILE" | sed -E 's/^Branch:[[:space:]]*//' | tr -d '\r' | xargs)
          if [ -z "$TARGET_BRANCH" ]; then
            echo "$TICKET_FILE has no Branch: field — skipping."
            echo "should_rename=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TARGET_BRANCH" = "$CURRENT_BRANCH" ]; then
            echo "Branch already matches the ticket's convention — nothing to do."
            echo "should_rename=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $TICKET_FILE → renaming '$CURRENT_BRANCH' to '$TARGET_BRANCH'"
          echo "should_rename=true" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Rename branch (GitHub retargets the open PR automatically)
        if: steps.ticket.outputs.should_rename == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ steps.ticket.outputs.target_branch }}
        run: |
          set -euo pipefail

          if gh api "repos/${{ github.repository }}/branches/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::warning::Target branch '$TARGET_BRANCH' already exists — leaving '$CURRENT_BRANCH' as-is."
            gh pr comment "${{ github.event.pull_request.number }}" --body \
              "⚠️ Couldn't rename this branch to \`$TARGET_BRANCH\` per the ticket's naming convention — a branch with that name already exists. Left as \`$CURRENT_BRANCH\`; rename manually if you want the convention name."
            exit 0
          fi

          gh api --method POST "repos/${{ github.repository }}/branches/$CURRENT_BRANCH/rename" \
            -f "new_name=$TARGET_BRANCH"

          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "🤖 Renamed this PR's branch from \`$CURRENT_BRANCH\` to \`$TARGET_BRANCH\` to match the ticket's naming convention (\`Docs/tickets/TICKET_SPEC.md\`)."
