name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ── PR Quality Gate ────────────────────────────────────────────────────────
  pr:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          # Bootstrap DB only, not load-bearing after boot. Why:
          # Docs/IMPLEMENTATION_NOTES.md § T-071.
          POSTGRES_DB: questlog_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Turborepo local cache ────────────────────────────────────────────
      # Persists .turbo/cache (gitignored, turbo's on-disk task cache) across
      # runs so lint/typecheck/build cache-hit when their inputs haven't
      # changed. test:e2e stays uncached — turbo.json marks it cache:false.
      # test itself has no such override, so turbo caches it too and will
      # replay a prior run's real-DB result when the task hash is unchanged;
      # that's only safe because the hash covers all first-party inputs, so
      # a replay only ever fires when nothing that could change the DB-backed
      # result actually changed. Restore-keys fallback (lockfile hash only)
      # so a source-only miss still restores the last cacheable state instead
      # of starting fully cold. Why: Docs/tickets/T-086.
      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'biome.json', 'tsconfig.base.json', 'apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/tsconfig*.json', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/tsconfig*.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm turbo lint

      # ── Typecheck ─────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm turbo typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm turbo build

      # ── Guard: no test.only or test.skip ─────────────────────────────────
      - name: Check for test.only / test.skip
        run: |
          if grep -rn --include="*.test.ts" --include="*.test.tsx" \
               -E "(test|it|describe)\.(only|skip)\(" \
               apps/ packages/; then
            echo ""
            echo "❌ Found test.only or test.skip. Remove them or link to a tracking issue."
            exit 1
          fi
          echo "✅ No test.only or test.skip found."

      # ── Provision and migrate every test-tier database ──────────────────
      # Migrate once per schema family into a template database, then clone
      # every test-tier database from its matching template instead of
      # replaying the full migration set per database. Postgres refuses to
      # clone a template with open connections — each migrate command's own
      # tool closes its connection on exit (migrate.ts's `client.end()`), so
      # by the time the CREATE DATABASE ... TEMPLATE loop below starts, both
      # templates are already connection-free. Why: Docs/tickets/T-086,
      # Docs/IMPLEMENTATION_NOTES.md § T-071 (also § T-027).
      - name: Provision and migrate test-tier databases
        run: |
          source scripts/test-db-names.sh
          for template in "${TEST_DB_TEMPLATES[@]}"; do
            PGPASSWORD=questlog psql -h localhost -p 5433 -U questlog -d questlog_test -c "CREATE DATABASE ${template}"
          done
          DATABASE_URL="postgresql://questlog:questlog@localhost:5433/${TEST_DB_TEMPLATE_CORE}" eval "$(test_db_migrate_cmd "$TEST_DB_NAME_CORE")"
          DATABASE_URL="postgresql://questlog:questlog@localhost:5433/${TEST_DB_TEMPLATE_OBSERVABILITY}" eval "$(test_db_migrate_cmd "$TEST_DB_NAME_OBSERVABILITY")"
          for dbname in "${TEST_DB_NAMES_CI[@]}"; do
            template="$(test_db_template_name "$dbname")"
            PGPASSWORD=questlog psql -h localhost -p 5433 -U questlog -d questlog_test -c "CREATE DATABASE ${dbname} TEMPLATE ${template}"
          done

      # ── Full test suite ───────────────────────────────────────────────────
      # Unit + integration only (real DB, mocked external APIs). The real-API
      # e2e tier (*.e2e.test.ts) is deliberately excluded from this gate — see
      # the e2e-nightly workflow and Docs/IMPLEMENTATION_NOTES.md.
      - name: Test
        run: pnpm turbo test

  # ── Doc-Sync Warning ──────────────────────────────────────────────────────
  doc-sync:
    name: Doc-Sync Check
    runs-on: ubuntu-latest
    # Only relevant on PRs; skip on direct pushes to main (post-merge)
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for code changes without Docs/ update
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          CODE_CHANGED=false
          DOCS_CHANGED=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE "^(apps|packages)/"; then
              CODE_CHANGED=true
            fi
            if echo "$file" | grep -qE "^Docs/"; then
              DOCS_CHANGED=true
            fi
          done <<< "$CHANGED"

          if $CODE_CHANGED && ! $DOCS_CHANGED; then
            if echo "$PR_TITLE" | grep -q "\[skip-doc-check\]"; then
              echo "ℹ️ Doc-sync check skipped via [skip-doc-check] in PR title."
              exit 0
            fi
            echo "⚠️ Code changed without a Docs/ update. If intentional, add [skip-doc-check] to your PR title."
            # Warning only — not a hard fail
            exit 0
          fi

          echo "✅ Doc-sync check passed."

  # ── Migration Guard ───────────────────────────────────────────────────────
  migration-guard:
    name: Migration Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check schema changes have migrations
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          SCHEMA_CHANGED=false
          MIGRATION_ADDED=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE ".*/schema/.*\.(ts|sql)$" && ! echo "$file" | grep -qE "\.test\.ts$"; then
              SCHEMA_CHANGED=true
            fi
            if echo "$file" | grep -qE ".*/migrations/.*\.sql$"; then
              MIGRATION_ADDED=true
            fi
          done <<< "$CHANGED"

          if $SCHEMA_CHANGED && ! $MIGRATION_ADDED; then
            echo ""
            echo "❌ Schema files were changed but no new migration SQL file was found."
            echo "   Run: pnpm drizzle-kit generate"
            echo "   Then commit the generated file from apps/server/src/db/migrations/"
            exit 1
          fi

          if $SCHEMA_CHANGED && $MIGRATION_ADDED; then
            echo "✅ Migration guard passed — schema change has a corresponding migration."
          else
            echo "✅ Migration guard passed — no schema changes detected."
          fi

  # ── Gate Guard ─────────────────────────────────────────────────────────────
  # Fails a PR whose diff introduces or leaves a ticket file carrying an
  # unresolved `Gated on:` or an unmet `Blocked on:` — the machine-checked
  # version of the invariant CLAUDE.md/EXECUTOR_ROUTINE.md already state in
  # prose. Logic lives in packages/ci/src/gate-guard.ts (unit-tested
  # there); scripts/ci-gate-guard.sh is the same reusable entry point T-115's
  # pre-flight wiring will call. Why: Docs/tickets/gated/resolved/G-020.
  gate-guard:
    name: Gate Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Check for unresolved Gated on: / unmet Blocked on:"
        run: scripts/ci-gate-guard.sh origin/${{ github.base_ref }}

  # ── Scope Guard ────────────────────────────────────────────────────────────
  # For a ticket-implementation PR (head branch prefix `feat/*`, TICKET_SPEC.md's
  # "Branch naming" convention): warns (does not fail) when the diff touches a
  # path outside the ticket's declared `Context files:` and not newly created
  # by this diff; hard-fails if the diff touches `Docs/mockups/` (narrower
  # version of mockup-guard's own check, scoped to ticket-implementation PRs)
  # or if the PR's base branch isn't `develop`. Logic lives in
  # packages/ci/src/scope-guard.ts (unit-tested there); scripts/ci-scope-guard.sh
  # is the same kind of thin, reusable entry point as gate-guard's above.
  # Why: Docs/tickets/gated/resolved/G-020 § Q2.
  scope-guard:
    name: Scope Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Check diff is confined to declared Context files:, base is develop"
        # github.head_ref is attacker-controlled (a fork's branch name) — pass
        # it through env, never interpolate it directly into the run: script,
        # per actionlint's expression-injection check.
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: scripts/ci-scope-guard.sh "origin/$BASE_BRANCH" "$HEAD_BRANCH" "$BASE_BRANCH"

  # ── Mockup Guard ──────────────────────────────────────────────────────────
  # Docs/mockups/ is generated manually in Claude Design during planning
  # sessions and is read-only to agents (see Docs/mockups/README.md). A
  # ticket branch touching it means an executor edited a mockup instead of
  # just reading it — hard fail, not a warning.
  mockup-guard:
    name: Mockup Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check diff does not touch Docs/mockups/
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$CHANGED" | grep -qE "^Docs/mockups/"; then
            echo ""
            echo "❌ This PR modifies Docs/mockups/. Mockups are read-only to agents —"
            echo "   generated manually by Alex in Claude Design during planning sessions."
            echo "   Revert changes under Docs/mockups/ from this branch."
            exit 1
          fi

          echo "✅ Mockup guard passed — Docs/mockups/ untouched."

  # ── IMPLEMENTATION_NOTES Health ───────────────────────────────────────────
  impl-notes-health:
    name: Implementation Notes Health
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check IMPLEMENTATION_NOTES.md size
        run: |
          FILE="Docs/IMPLEMENTATION_NOTES.md"
          LINE_COUNT=$(wc -l < "$FILE")
          LIMIT=300

          echo "ℹ️ $FILE is $LINE_COUNT lines (limit: $LIMIT)."

          if [ "$LINE_COUNT" -gt "$LIMIT" ]; then
            echo ""
            echo "⚠️ IMPLEMENTATION_NOTES.md has grown past $LIMIT lines ($LINE_COUNT)."
            echo "   Consider archiving resolved or stable entries to Docs/IMPLEMENTATION_NOTES_ARCHIVE.md"
            echo "   before merging, to keep session startup reads fast."
            echo "   This is a warning only — not a hard failure."
          else
            echo "✅ Size check passed."
          fi

      - name: Check write obligation for sensitive file changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          SENSITIVE_CHANGED=false
          IMPL_NOTES_CHANGED=false

          while IFS= read -r file; do
            # Sensitive patterns: service files, schema, AI/LLM layer
            if echo "$file" | grep -qE "\.(service|schema|router)\.(ts|tsx)$|schema/tables\.ts|/ai/"; then
              SENSITIVE_CHANGED=true
            fi
            if echo "$file" | grep -qE "^Docs/IMPLEMENTATION_NOTES\.md$"; then
              IMPL_NOTES_CHANGED=true
            fi
          done <<< "$CHANGED"

          if $SENSITIVE_CHANGED && ! $IMPL_NOTES_CHANGED; then
            if echo "$PR_TITLE" | grep -q "\[skip-impl-notes\]"; then
              echo "ℹ️ Implementation notes check skipped via [skip-impl-notes] in PR title."
              exit 0
            fi
            echo ""
            echo "⚠️ Service, schema, or AI files changed without updating IMPLEMENTATION_NOTES.md."
            echo "   If a non-obvious decision was made, document it before merging."
            echo "   If no new decision was needed, add [skip-impl-notes] to your PR title."
            echo "   This is a warning only — not a hard failure."
          else
            echo "✅ Implementation notes check passed."
          fi

  # ── Workflow Self-Validation ──────────────────────────────────────────────
  actionlint:
    name: Validate workflow files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install and run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
