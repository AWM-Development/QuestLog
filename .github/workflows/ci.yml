name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ── PR Quality Gate ────────────────────────────────────────────────────────
  pr:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          # Bootstrap DB only, not load-bearing after boot. Why:
          # Docs/IMPLEMENTATION_NOTES.md § T-071.
          POSTGRES_DB: questlog_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Bare checkout first so the runner can resolve the local composite
      # action below (a `uses: ./...` reference requires the repo already
      # checked out) — setup-repo's own checkout step then re-checks out
      # with the real ref/fetch-depth, superseding this one.
      - uses: actions/checkout@v5

      # ── Guard: no test.only or test.skip ─────────────────────────────────
      # Runs first, right after the bare checkout above — a plain grep over
      # already-checked-out source that needs none of setup-repo's install
      # output. A stray .only/.skip should fail in seconds, not after paying
      # for install + Lint + Typecheck + Build first. Why:
      # Docs/tickets/reports/T-117-github-actions-lean-audit.md finding #10.
      - name: Check for test.only / test.skip
        run: |
          if grep -rn --include="*.test.ts" --include="*.test.tsx" \
               -E "(test|it|describe)\.(only|skip)\(" \
               apps/ packages/; then
            echo ""
            echo "❌ Found test.only or test.skip. Remove them or link to a tracking issue."
            exit 1
          fi
          echo "✅ No test.only or test.skip found."

      - uses: ./.github/actions/setup-repo

      # test:e2e stays uncached — turbo.json marks it cache:false. test
      # itself has no such override, so turbo caches it too and will replay
      # a prior run's real-DB result when the task hash is unchanged;
      # that's only safe because the hash covers all first-party inputs, so
      # a replay only ever fires when nothing that could change the DB-backed
      # result actually changed. Why: Docs/tickets/T-086.
      - uses: ./.github/actions/restore-turbo-cache

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm turbo lint

      # ── Typecheck ─────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm turbo typecheck

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm turbo build

      - uses: ./.github/actions/provision-test-databases

      # ── Full test suite ───────────────────────────────────────────────────
      # Unit + integration only (real DB, mocked external APIs). The real-API
      # e2e tier (*.e2e.test.ts) is deliberately excluded from this gate — see
      # the e2e-nightly workflow and Docs/IMPLEMENTATION_NOTES.md.
      - name: Test
        run: pnpm turbo test

  # ── Guards ─────────────────────────────────────────────────────────────────
  # doc-sync, migration-guard, mockup-guard, and impl-notes-health each used
  # to be a separate job that independently ran a full-history checkout and
  # independently recomputed the same `git diff --name-only
  # origin/<base>...HEAD` file list. Consolidated onto one shared checkout +
  # one diff computation (exposed as this job's `changed-files` output),
  # consumed by each check step below. All four checks now hard-fail
  # (`exit 1`) on their violation path — doc-sync/impl-notes-health's
  # warning-only exit-0 paths were tightened into real gates by T-122,
  # matching migration-guard/mockup-guard's existing behavior. Each step
  # after the diff computation runs `if: always()` so an earlier step's
  # failure doesn't skip the checks after it, preserving the old
  # independent-jobs behavior where one guard failing never stopped another
  # from running. Why: Docs/tickets/reports/T-117-github-actions-lean-audit.md
  # finding #4.
  guards:
    name: Guards (doc-sync · migration · mockup · impl-notes-health)
    runs-on: ubuntu-latest
    # Only relevant on PRs; skip on direct pushes to main (post-merge)
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          {
            echo "changed<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Doc-Sync Check
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGED: ${{ steps.changed-files.outputs.changed }}
        run: |
          CODE_CHANGED=false
          DOCS_CHANGED=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE "^(apps|packages)/"; then
              CODE_CHANGED=true
            fi
            if echo "$file" | grep -qE "^Docs/"; then
              DOCS_CHANGED=true
            fi
          done <<< "$CHANGED"

          if $CODE_CHANGED && ! $DOCS_CHANGED; then
            if echo "$PR_TITLE" | grep -q "\[skip-doc-check\]"; then
              echo "ℹ️ Doc-sync check skipped via [skip-doc-check] in PR title."
              exit 0
            fi
            echo "❌ Code changed without a Docs/ update. If intentional, add [skip-doc-check] to your PR title."
            exit 1
          fi

          echo "✅ Doc-sync check passed."

      - name: Migration Guard
        if: always()
        env:
          CHANGED: ${{ steps.changed-files.outputs.changed }}
        run: |
          SCHEMA_CHANGED=false
          MIGRATION_ADDED=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE ".*/schema/.*\.(ts|sql)$" && ! echo "$file" | grep -qE "\.test\.ts$"; then
              SCHEMA_CHANGED=true
            fi
            if echo "$file" | grep -qE ".*/migrations/.*\.sql$"; then
              MIGRATION_ADDED=true
            fi
          done <<< "$CHANGED"

          if $SCHEMA_CHANGED && ! $MIGRATION_ADDED; then
            echo ""
            echo "❌ Schema files were changed but no new migration SQL file was found."
            echo "   Run: pnpm drizzle-kit generate"
            echo "   Then commit the generated file from apps/server/src/db/migrations/"
            exit 1
          fi

          if $SCHEMA_CHANGED && $MIGRATION_ADDED; then
            echo "✅ Migration guard passed — schema change has a corresponding migration."
          else
            echo "✅ Migration guard passed — no schema changes detected."
          fi

      - name: Mockup Guard
        if: always()
        env:
          CHANGED: ${{ steps.changed-files.outputs.changed }}
        run: |
          if echo "$CHANGED" | grep -qE "^Docs/mockups/"; then
            echo ""
            echo "❌ This PR modifies Docs/mockups/. Mockups are read-only to agents —"
            echo "   generated manually by Alex in Claude Design during planning sessions."
            echo "   Revert changes under Docs/mockups/ from this branch."
            exit 1
          fi

          echo "✅ Mockup guard passed — Docs/mockups/ untouched."

      - name: Check IMPLEMENTATION_NOTES.md size
        if: always()
        run: |
          FILE="Docs/IMPLEMENTATION_NOTES.md"
          LINE_COUNT=$(wc -l < "$FILE")
          LIMIT=800

          echo "ℹ️ $FILE is $LINE_COUNT lines (limit: $LIMIT)."

          if [ "$LINE_COUNT" -gt "$LIMIT" ]; then
            echo ""
            echo "❌ IMPLEMENTATION_NOTES.md has grown past $LIMIT lines ($LINE_COUNT)."
            echo "   Archive resolved or stable entries to Docs/IMPLEMENTATION_NOTES_ARCHIVE.md"
            echo "   before merging, to keep session startup reads fast."
            exit 1
          else
            echo "✅ Size check passed."
          fi

      - name: Check write obligation for sensitive file changes
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGED: ${{ steps.changed-files.outputs.changed }}
        run: |
          SENSITIVE_CHANGED=false
          IMPL_NOTES_CHANGED=false

          while IFS= read -r file; do
            # Sensitive patterns: service files, schema, AI/LLM layer
            if echo "$file" | grep -qE "\.(service|schema|router)\.(ts|tsx)$|schema/tables\.ts|/ai/"; then
              SENSITIVE_CHANGED=true
            fi
            if echo "$file" | grep -qE "^Docs/IMPLEMENTATION_NOTES\.md$"; then
              IMPL_NOTES_CHANGED=true
            fi
          done <<< "$CHANGED"

          if $SENSITIVE_CHANGED && ! $IMPL_NOTES_CHANGED; then
            if echo "$PR_TITLE" | grep -q "\[skip-impl-notes\]"; then
              echo "ℹ️ Implementation notes check skipped via [skip-impl-notes] in PR title."
              exit 0
            fi
            echo ""
            echo "❌ Service, schema, or AI files changed without updating IMPLEMENTATION_NOTES.md."
            echo "   Document the non-obvious decision before merging, or add [skip-impl-notes] to your PR title."
            exit 1
          else
            echo "✅ Implementation notes check passed."
          fi

  # ── Ticket Guards (Gate · Scope · Report) ───────────────────────────────────
  # Gate/Scope/Report guards used to be three separate jobs. Each is a fast,
  # single-script check (real work: a few seconds — under the 1-minute
  # billing floor a separate job always pays regardless of actual duration)
  # sharing the same trigger condition and the same setup-repo preamble, so
  # they're consolidated into one job's steps — the same pattern T-121
  # already applied to doc-sync/migration-guard/mockup-guard/
  # impl-notes-health below (the `guards` job). Each step runs `if:
  # always()` so one guard's failure doesn't skip the checks after it,
  # preserving the old independent-jobs behavior. Why (minutes case):
  # Docs/tickets/reports/T-128-ci-actions-minutes-audit.md finding #1.
  #
  # - Gate Guard: fails a PR whose diff introduces or leaves a ticket file
  #   carrying an unresolved `Gated on:` or an unmet `Blocked on:` — the
  #   machine-checked version of the invariant CLAUDE.md/
  #   EXECUTOR_ROUTINE.md already state in prose. Logic lives in
  #   packages/ci/src/gate-guard.ts (unit-tested there);
  #   scripts/ci-gate-guard.sh is the same reusable entry point T-115's
  #   pre-flight wiring calls. Why: Docs/tickets/gated/resolved/G-020.
  # - Scope Guard: for a ticket-implementation PR (head branch prefix
  #   `feat/*`, TICKET_SPEC.md's "Branch naming" convention): warns (does
  #   not fail) when the diff touches a path outside the ticket's declared
  #   `Context files:` and not newly created by this diff; hard-fails if
  #   the diff touches `Docs/mockups/` (narrower version of mockup-guard's
  #   own check, scoped to ticket-implementation PRs) or if the PR's base
  #   branch isn't `develop`. Logic lives in packages/ci/src/scope-guard.ts
  #   (unit-tested there). Why: Docs/tickets/gated/resolved/G-020 § Q2.
  # - Report Guard: for a ticket-implementation PR (same detection as Scope
  #   Guard's above): hard-fails when the diff adds a Docs/tickets/reports/
  #   file that isn't structurally complete against REPORT_TEMPLATE.md — a
  #   required heading missing, a leftover `<...>` template placeholder, or
  #   a `## Test evidence` section with no recognizable tool-output marker.
  #   Does not check whether the report's claims are *true* (that's
  #   T-113/T-114). Logic lives in packages/ci/src/report-guard.ts
  #   (unit-tested there). Why: Docs/tickets/gated/resolved/G-020 § Q2.
  ticket-guards:
    name: Ticket Guards (Gate · Scope · Report)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      # Bare checkout first so the runner can resolve the local composite
      # action below (a `uses: ./...` reference requires the repo already
      # checked out) — setup-repo's own checkout step then re-checks out
      # with the real ref/fetch-depth, superseding this one.
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          fetch-depth: 0

      - name: "Gate Guard — check for unresolved Gated on: / unmet Blocked on:"
        if: always()
        run: scripts/ci-gate-guard.sh origin/${{ github.base_ref }}

      - name: "Scope Guard — check diff is confined to declared Context files:, base is develop"
        if: always()
        # github.head_ref is attacker-controlled (a fork's branch name) — pass
        # it through env, never interpolate it directly into the run: script,
        # per actionlint's expression-injection check.
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: scripts/ci-scope-guard.sh "origin/$BASE_BRANCH" "$HEAD_BRANCH" "$BASE_BRANCH"

      - name: "Report Guard — check any newly-added report is structurally complete"
        if: always()
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: scripts/ci-report-guard.sh "origin/${{ github.base_ref }}" "$HEAD_BRANCH"

  # ── Red-Check (TDD Enforcement) ──────────────────────────────────────────
  # For a ticket-implementation PR (head branch prefix `feat/*`, same
  # detection as scope-guard's/report-guard's above): identifies the PR's
  # added/modified test files, then requires at least one of them (excluding
  # any exempt as a pure test-only refactor — unchanged/lower assertion
  # count vs. develop) to fail when run against develop's pre-change
  # implementation. Proves a test was written to exercise genuinely new
  # behavior, not written after the fact against an implementation that
  # already existed. Deliberately excluded from the executor's own
  # pre-flight (T-115) — it needs a completed diff to run against. Logic
  # lives in packages/ci/src/red-check-guard.ts (branching logic
  # unit-tested there; the worktree/vitest orchestration behind it is
  # real-deps-only, see that file's header); scripts/ci-red-check-guard.sh
  # is the same kind of thin, reusable entry point as the other guards'
  # above. Why: Docs/tickets/gated/resolved/G-020 § Q2.
  red-check:
    name: Red-Check (TDD Enforcement)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          POSTGRES_DB: questlog_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          fetch-depth: 0

      - uses: ./.github/actions/provision-test-databases

      - name: "Red-check — PR's new tests must fail against develop's pre-change implementation"
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: scripts/ci-red-check-guard.sh "origin/${{ github.base_ref }}" "$HEAD_BRANCH"

  # ── Workflow Self-Validation ──────────────────────────────────────────────
  actionlint:
    name: Validate workflow files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pinned to a specific actionlint release (both the download script's
      # own ref and the binary version it fetches) instead of the prior
      # `main`-branch script fetch, which pulled and executed unpinned code
      # on every run. Why: Docs/tickets/reports/T-117-github-actions-lean-audit.md
      # finding #14.
      - name: Install and run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
