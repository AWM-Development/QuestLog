# Fly.io app config for apps/server — DEV environment.
# Generated by T-024, then regenerated by `flyctl launch --no-deploy` (T-024
# checklist walkthrough) — app created, not deployed yet (see
# Docs/DEPLOY_SETUP_CHECKLIST.md, deploy deferred until this code reaches
# `main`). Deploy manually with:
#   flyctl deploy -c fly.dev.toml
# from the repo root (build context — see apps/server/Dockerfile's own header
# comment for why it can't be apps/server/). Never auto-deployed by CI/GitHub
# — dev stays manual-only (see DEPLOY_SETUP_CHECKLIST.md §3).
#
# Points at the Neon *child branch* database (Docs/DEPLOY_READINESS.md §2.3) —
# set via `fly secrets set DATABASE_URL=...` against this app, never here.

app = 'questlog-dev'
# "iad" (Ashburn, VA) is the deliberate choice, not a placeholder: the Neon
# project (Docs/DEPLOY_SETUP_CHECKLIST.md §1) landed in us-east-2 (Ohio), and
# iad is Fly's nearest low-latency US-east region to it.
primary_region = 'iad'

[build]
  dockerfile = 'apps/server/Dockerfile'

[deploy]
  # Explicit, separate migration step — never on server boot (multiple
  # concurrently-starting machines would race to apply the same migration).
  # Fly runs this once, before routing traffic to the new release.
  release_command = 'node dist/db/migrate.js'

[env]
  PORT = '3000'
  # DATABASE_URL, ANTHROPIC_API_KEY, VOYAGE_API_KEY, CORS_ORIGIN are secrets/
  # per-environment values — set via `fly secrets set`, never committed here.
  # See deploy/env.dev.example for the full list this app needs.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
