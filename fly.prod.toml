# Fly.io app config for apps/server — PROD environment.
# Generated by T-024; never applied automatically (no `fly launch`/`fly deploy`
# run by this ticket or the nightly executor — see Docs/DEPLOY_SETUP_CHECKLIST.md
# for the manual steps that make this real). Deployed automatically by
# .github/workflows/deploy.yml on every push to `main` (Alex merging `develop`
# into `main` — this repo's only deploy trigger, per Docs/IMPLEMENTATION_NOTES.md
# "main is deploy-only"), or manually with:
#   flyctl deploy -c fly.prod.toml
# from the repo root (build context — see apps/server/Dockerfile's own header
# comment for why it can't be apps/server/).
#
# Points at the Neon *root branch* database (Docs/DEPLOY_READINESS.md §2.3) —
# set via `fly secrets set DATABASE_URL=...` against this app, never here.

app = "questlog-prod"
# Alex: pick a real region at `fly launch` time (see checklist) — "iad"
# (Ashburn, VA) is a placeholder, Fly's common default, not a hard decision.
# Keep in sync with fly.dev.toml unless there's a specific reason to diverge.
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[deploy]
  # Explicit, separate migration step — never on server boot (multiple
  # concurrently-starting machines would race to apply the same migration).
  # Fly runs this once, before routing traffic to the new release.
  release_command = "node apps/server/dist/db/migrate.js"

[env]
  PORT = "3000"
  # DATABASE_URL, ANTHROPIC_API_KEY, VOYAGE_API_KEY, CORS_ORIGIN are secrets/
  # per-environment values — set via `fly secrets set`, never committed here.
  # See deploy/env.prod.example for the full list this app needs.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
